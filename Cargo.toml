[package]
name = "hypr-ipc"
version = "0.1.2"
edition = "2021"
license = "MIT"
description = "Fail-closed Hyprland instance discovery, socket2 events, and hyprctl"
repository = "https://github.com/MasonRhodesDev/hypr-ipc"
publish = true

[dependencies]
xdg-paths = "0.2.0"
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["net", "process", "time", "rt"] }
